<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear pedido')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <h1 class="h2 mb-4">Crear pedido</h1>
    <form method="post" th:action="@{/pedidos/crear}" th:object="${pedido}">
        <div th:replace="~{fragments/campos-pedido :: campos}"></div>
        <button class="btn btn-primary" type="submit">Guardar</button>
        <a class="btn btn-outline-secondary" th:href="@{/pedidos}">Cancelar</a>
    </form>
</main>
</body>
</html>
